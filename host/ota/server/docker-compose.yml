services:
  millennium-updates:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: millennium-updates
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0777
      - /var/run:size=1m,mode=0777
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/srv/updates:ro
    networks:
      - npm-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  npm-net:
    external: true
