# METABEGIN
# X-Env-Layer-Name: millennium-phone-image
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: Millennium phone base appliance and NetworkManager authority.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: systemd-min
# METAEND
---
mmdebstrap:
  packages:
    - network-manager
    - openssh-server
    - nftables
    - curl
    - ca-certificates
    - alsa-utils
    - python3
    - dnsmasq-base
    - openssl
    - sudo
    - avrdude
  customize-hooks:
    - |
      set -eu
      # The upstream family layer supports EEPROM-equipped Pi models and pulls
      # a diagnostics/development tool chain. Zero 2 W has no bootloader EEPROM;
      # retain raspi-utils-core but remove that unused production payload.
      chroot "$1" env DEBIAN_FRONTEND=noninteractive apt-get purge -y \
        rpi-eeprom raspi-utils raspi-utils-dt raspi-utils-eeprom raspi-utils-otp \
        raspinfo flashrom device-tree-compiler binutils
      chroot "$1" env DEBIAN_FRONTEND=noninteractive apt-get autoremove -y --purge
    - |
      set -eu
      test -x "$1/usr/sbin/NetworkManager"
      chroot "$1" systemctl disable systemd-networkd.service systemd-networkd-wait-online.service iwd.service 2>/dev/null || true
      chroot "$1" systemctl enable NetworkManager.service NetworkManager-wait-online.service ssh.service nftables.service
      install -d -m 0700 "$1/etc/NetworkManager/system-connections"
      install -d -m 0755 "$1/etc/NetworkManager/conf.d"
      cat > "$1/etc/NetworkManager/conf.d/10-millennium.conf" <<'EOF'
      [main]
      plugins=keyfile
      rc-manager=symlink

      [device]
      wifi.scan-rand-mac-address=yes
      EOF
    - |
      set -eu
      # The static slot mapper is mandatory after converting the upstream GPT
      # layout to MBR: DOS partitions have no PARTLABELs for the label mapper.
      # Its initramfs hook copies /boot/slot.map, so create it before forcing
      # regeneration of every installed kernel's initramfs.
      test -x "$1/usr/bin/rpi-slot-static"
      install -m 0644 "$SRCROOT/host/os_image/slot.map" "$1/boot/slot.map"
      install -D -m 0755 "$SRCROOT/host/os_image/89-millennium-mbr-slots" \
        "$1/etc/initramfs-tools/scripts/local-premount/89-millennium-mbr-slots"
      chroot "$1" update-initramfs -u -k all
      found=0
      for initramfs in "$1"/boot/firmware/initramfs*; do
        test -f "$initramfs" || continue
        found=1
        chroot "$1" lsinitramfs "${initramfs#$1}" | grep -qx 'boot/slot.map'
        chroot "$1" lsinitramfs "${initramfs#$1}" | \
          grep -qx 'scripts/local-premount/89-millennium-mbr-slots'
      done
      test "$found" -eq 1
    - |
      set -eu
      payload="$SRCROOT/payload/rootfs"
      test -x "$payload/usr/local/bin/millennium-daemon" || {
        echo "missing staged Millennium image payload; run tools/stage_zero2w_image_payload.sh" >&2
        exit 1
      }
      cp -a "$payload/." "$1/"
      chroot "$1" systemctl enable daemon.service millennium-firewall.service
      chroot "$1" systemctl enable millennium-monitor.timer millennium-hil-smoke.timer
      chroot "$1" systemctl enable millennium-physical-interruption-reconcile.service
      chroot "$1" systemctl enable millennium-maintenance-tunnel.service
      chroot "$1" systemctl enable millennium-update-recover.service
      chroot "$1" systemctl enable millennium-update-check.timer millennium-update-apply.timer
      chroot "$1" systemctl enable millennium-os-update-recover.service
      chroot "$1" systemctl enable millennium-os-update-boot-health.service
      chroot "$1" systemctl enable millennium-os-update-check.timer millennium-os-update-apply.timer
      chroot "$1" systemctl enable millennium-wifi-bootstrap.service millennium-wifi-helper.service
      chroot "$1" systemctl enable millennium-wifi-portal.service millennium-wifi-recovery.path
      chroot "$1" chown -R millennium:millennium /var/lib/millennium /var/log/millennium
