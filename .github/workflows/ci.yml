name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Compile the real daemon sources (incl. the ALSA paths in audio_tones.c,
      # web_server, websocket, health_monitor) that the simulator/unit-test
      # builds stub out. Catches type/syntax breakage that would otherwise only
      # surface on the Pi's `make daemon`. pjsip_interface.c is excluded — it
      # needs libpjproject, which isn't available here.
      - name: Compile-check daemon sources
        working-directory: host
        run: make compile-check

      - name: Build simulator
        working-directory: host
        run: make simulator

      - name: Verify generated compatibility metadata
        run: python3 tools/generate_version_metadata.py --check

      - name: Run scenario tests
        working-directory: host
        run: make test

      - name: Test QEMU virtual MCU protocol
        run: python3 tools/qemu/test_virtual_mcu.py

      - name: Test acceptance evidence gates
        run: |
          python3 tools/tests/test_acceptance_evidence.py
          python3 host/tests/test_maintenance_repair.py

  # Second opinion from clang (#237). The two compilers implement different
  # warning sets, and the build treats warnings as errors: GCC has
  # -Wstringop-truncation and -Wmaybe-uninitialized, clang has its own
  # -Wunused-* and -Wconditional-uninitialized behaviour. Neither alone covers
  # the other, so a clean GCC build is not evidence the source is warning-free.
  #
  # This also mirrors what a developer sees on macOS, where `gcc` is a shim for
  # Apple clang -- previously the local build and CI could disagree with no
  # signal until CI failed.
  #
  # compile-check only: the scenario/unit suites are behavioural and the `test`
  # job above already runs them. This job is about diagnostics.
  compile-check-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev clang

      - name: Compile-check daemon sources with clang
        working-directory: host
        run: make compile-check CC=clang

  production-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libasound2-dev libssl-dev \
            libsamplerate0-dev libspeex-dev libspeexdsp-dev pkg-config nftables shellcheck

      - name: Build pinned PJSIP 2.14.1
        run: |
          git clone --filter=blob:none https://github.com/pjsip/pjproject.git /tmp/pjproject
          git -C /tmp/pjproject checkout --detach 2f4bc29b2fa65cc29e50ba03f0b8b6de820eaf6b
          test "$(git -C /tmp/pjproject rev-parse HEAD)" = 2f4bc29b2fa65cc29e50ba03f0b8b6de820eaf6b
          cd /tmp/pjproject
          ./configure --prefix=/opt/pjproject --disable-video --disable-sdl \
            --disable-ffmpeg --disable-v4l2 --disable-openh264
          make dep
          make -j2
          sudo make install
          echo 'PKG_CONFIG_PATH=/opt/pjproject/lib/pkgconfig' >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=/opt/pjproject/lib/pkgconfig pkg-config --modversion libpjproject | grep '^2\.14\.1$'

      - name: Build and run PJSIP smoke test
        working-directory: host
        run: make daemon pjsip-smoke && ./pjsip-smoke "" ""

      - name: Validate shell and systemd assets
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck
          systemd-analyze verify host/systemd/*.service host/systemd/*.timer
          sudo nft --check --file host/firewall/millennium.nft

      - name: Upload production daemon
        uses: actions/upload-artifact@v4
        with:
          name: production-daemon
          path: host/daemon

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Arduino CLI and AVR core
        run: |
          curl -fsSLo /tmp/arduino-cli.tar.gz https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  /tmp/arduino-cli.tar.gz' | sha256sum -c -
          tar -xzf /tmp/arduino-cli.tar.gz -C /tmp
          /tmp/arduino-cli core update-index
          /tmp/arduino-cli core install arduino:avr@1.8.8

      - name: Rebuild firmware reproducibly
        working-directory: Arduino
        run: make clean build ARDUINO_CLI=/tmp/arduino-cli

      - name: Verify checked-in firmware is current
        run: git diff --exit-code -- Arduino/build/keypad/keypad.ino.hex Arduino/build/display/display.ino.hex

  pcb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run source-level PCB guardrails
        working-directory: pcb
        run: make netlist-sync footprint-parity pinouts footprints
      - name: Run ERC and DRC with pinned KiCad
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work/pcb kicad/kicad:9.0.9 sch erc phonev6.kicad_sch --output erc_report.txt --severity-error --exit-code-violations
          docker run --rm --volume "$PWD:/work" --workdir /work/pcb kicad/kicad:9.0.9 pcb drc phonev6.kicad_pcb --output drc_report.txt --severity-error --exit-code-violations

  release-evidence:
    needs: [production-build, firmware, pcb, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-daemon
          path: build/production
      - name: Generate checksums, provenance, and SPDX SBOM
        run: python3 tools/release_evidence.py --output-dir build/evidence --daemon build/production/daemon
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: build/evidence
      - name: Publish evidence with tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" build/evidence/* --clobber

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev clang

      - name: Run unit tests with ASan and UBSan
        working-directory: host
        run: |
          make clean
          make unit_tests CC=clang CFLAGS='-g -O1 -Wall -Wextra -std=gnu89 -Wdeclaration-after-statement -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' UNIT_LDFLAGS='-lpthread -lasound -lm -fsanitize=address,undefined'
          ./unit_tests

  # Formal verification: CBMC proofs and SPIN model checks.
  #
  # Split from `test` because it needs extra toolchains and is slower. The
  # CBMC parser proofs dominate the runtime; they are the ones that found real
  # bugs in wav.c and the websocket decoder, so they are worth the minutes.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcc-multilib supplies the 32-bit libc headers. cbmc-parsers passes --32
      # deliberately, to model the Pi's 32-bit userland rather than the runner's
      # 64-bit one -- pointer and size_t width are exactly what those
      # memory-safety proofs are about. Without it CBMC's preprocessing step
      # dies on `bits/libc-header-start.h: No such file or directory`.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cbmc spin gcc-multilib

      # State machine + simulator/daemon equivalence. The equivalence proof is
      # what stops simulator.c and daemon.c drifting apart, which the scenario
      # tests cannot detect on their own.
      - name: CBMC - daemon state machine
        working-directory: host
        run: make state-check

      # Split so a failure names which proof broke. cbmc-parser is the slow one
      # (~2 min, --unwind 37); cbmc-parsers is seconds.
      - name: CBMC - serial parser
        working-directory: host
        run: make cbmc-parser

      - name: CBMC - wav / websocket / config parsers
        working-directory: host
        run: make cbmc-parsers

      - name: SPIN - Pi/Arduino wire protocol
        working-directory: host
        run: make model-check

      - name: SPIN - Operator game soft-lock
        working-directory: host
        run: make game-check

  # TLA+ model checking.
  #
  # Separate job so a TLC failure is immediately distinguishable from a build
  # or CBMC failure, and so the jar download does not slow the other jobs.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: host/tla2tools.jar
          key: tla2tools-v1

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o host/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: TLC - event ordering, coin ledger, OTA, lock order
        working-directory: host
        run: |
          make tla-check   TLA_TOOLS=tla2tools.jar
          make coin-check  TLA_TOOLS=tla2tools.jar
          make ota-check   TLA_TOOLS=tla2tools.jar
          make lock-check  TLA_TOOLS=tla2tools.jar

      # These two MUST fail: they encode a property that is unachievable by
      # design (tla-check-race) and a deliberately-cycled lock graph
      # (lock-check-mutant). If either starts passing, the model has stopped
      # detecting the thing it exists to detect -- which has happened twice in
      # this repo already. Inverted on purpose; do not "fix" them to pass.
      - name: TLC - negative controls must fail
        working-directory: host
        run: |
          if make tla-check-race TLA_TOOLS=tla2tools.jar >/dev/null 2>&1; then
            echo "tla-check-race PASSED but must fail -- ActiveImpliesOffHook is no longer detecting anything"
            exit 1
          fi
          echo "OK: tla-check-race fails as designed"
          if make lock-check-mutant TLA_TOOLS=tla2tools.jar >/dev/null 2>&1; then
            echo "lock-check-mutant PASSED but must fail -- the model cannot detect a planted deadlock"
            exit 1
          fi
          echo "OK: lock-check-mutant fails as designed"

      # Break the system in the way each property is meant to notice, and check
      # it fires. Guards against properties that hold vacuously -- see the
      # header of tests/mutation_audit.sh.
      - name: TLC - mutation audit
        working-directory: host
        run: make mutation-audit TLA_TOOLS=tla2tools.jar
